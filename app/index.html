<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Học thuộc kịch bản</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<meta name="theme-color" content="#1f6feb">
<style>
  :root { --bg: #f7f5f0; --panel: #ffffff; --ink: #1d1b18; --muted: #6b665e; --accent: #1f6feb; --line: #ddd8cf; --active: #e6efff; --repeat: #e8590c; --repeat-slide: #7048e8; --text-size: 32px; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #121211; --panel: #1d1c1a; --ink: #f1ede6; --muted: #a39d93; --accent: #4f8dff; --line: #34312c; --active: #1c2b45; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 18px/1.5 system-ui, sans-serif; }
  main { max-width: 720px; margin: 0 auto; padding: 16px; display: flex; flex-direction: column; min-height: 100%; gap: 10px; }
  header { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  #title { font-size: 15px; color: var(--muted); margin: 0; }
  #counter { font-size: 20px; font-weight: 700; white-space: nowrap; }
  #text { font-size: var(--text-size); line-height: 1.45; font-weight: 600; margin: 0; overflow-wrap: break-word; }
  .controls { display: grid; grid-template-columns: 1fr 1.3fr 1fr; gap: 8px; position: sticky; bottom: 0; background: var(--bg); padding: 6px 0; }
  .controls button { font: inherit; font-size: 18px; font-weight: 700; padding: 8px 4px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); }
  .controls #prev, .controls #next { user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; touch-action: manipulation; }
  .controls #play { background: var(--accent); border-color: var(--accent); color: #fff; }
  .options { display: flex; gap: 16px; flex-wrap: nowrap; align-items: center; font-size: 19px; white-space: nowrap; }
  select, button.small { font: inherit; padding: 8px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); }
  details { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; }
  summary { cursor: pointer; font-weight: 600; }
  ol { padding-left: 34px; margin: 8px 0 0; }
  #paragraph-list { position: relative; max-height: 50vh; overflow-y: auto; overscroll-behavior: contain; }
  #paragraph-list h3 { font-size: 16px; margin: 14px 0 0; color: var(--accent); cursor: pointer; }
  #paragraph-list li { padding: 6px 4px; border-radius: 8px; cursor: pointer; font-size: 16px; }
  #paragraph-list li.active { background: var(--active); font-weight: 600; }
  .speed { display: flex; align-items: center; gap: 6px; }
  #repeat { width: 100%; font: inherit; font-size: 18px; font-weight: 700; padding: 5px 12px; border-radius: 12px; border: 2px solid var(--line); background: var(--panel); color: var(--muted); }
  #repeat[data-mode="sentence"] { background: var(--repeat); border-color: var(--repeat); color: #fff; }
  #repeat[data-mode="slide"] { background: var(--repeat-slide); border-color: var(--repeat-slide); color: #fff; }
  #repeat-hint { margin: -6px 0 0; text-align: center; font-size: 14px; color: var(--muted); }
  .speed button { min-width: 40px; font-size: 20px; font-weight: 700; padding: 0; line-height: 1.5; }
  .speed button:disabled { opacity: .4; }
  #speed-value { min-width: 3.2em; text-align: center; font-size: 19px; }
  #player:not([hidden]) { display: contents; }
</style>
</head>
<body>
<main>
  <section id="player" hidden>
    <select id="lesson-select" hidden></select>
    <header>
      <p id="title"></p>
      <span id="counter"></span>
    </header>
    <p id="text"></p>
    <div class="options">
      <div class="speed">Tốc độ
        <button id="slower" class="small" aria-label="Chậm hơn">−</button>
        <b id="speed-value">0,80×</b>
        <button id="faster" class="small" aria-label="Nhanh hơn">+</button>
      </div>
      <div class="speed">
        <button id="text-smaller" class="small" aria-label="Chữ nhỏ hơn">A−</button>
        <button id="text-larger" class="small" aria-label="Chữ to hơn">A+</button>
      </div>
    </div>
    <button id="repeat" aria-pressed="false">🔁 Lặp lại: TẮT</button>
    <p id="repeat-hint"></p>
    <div class="controls">
      <button id="prev">⏮ Lùi</button>
      <button id="play">▶ Phát</button>
      <button id="next">Tiến ⏭</button>
    </div>
    <details>
      <summary>Danh sách câu (chạm để nhảy tới)</summary>
      <div id="paragraph-list"></div>
    </details>
  </section>

  <audio id="audio" preload="auto"></audio>
</main>
<script type="module" src="lesson-player.js?v=9"></script>
</body>
</html>
